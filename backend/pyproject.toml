[tool.black]
line-length = 88
target-version = ["py311"]



[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["B008"]  # Depends() de FastAPI dans les arguments

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]





[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

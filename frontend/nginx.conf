server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The API goes through the same address as the page: the session cookie stays on one origin
  # (no CORS, SameSite works) and the browser never talks to the backend directly.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 6m;  # CV upload: 5 MB maximum + multipart overhead
  }

  # Hashed build files can be cached for a long time.
  location /assets/ {
    expires 1y;
    access_log off;
  }

  # React Router: any other address must load the application (page refresh, direct links).
  location / {
    try_files $uri /index.html;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}